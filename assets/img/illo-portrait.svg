<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="A gentle portrait of an older woman.">
  <defs>
    <clipPath id="round"><circle cx="200" cy="200" r="176"/></clipPath>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3ead8"/>
      <stop offset="100%" stop-color="#c8d6c0"/>
    </linearGradient>
  </defs>

  <!-- outer warm ring -->
  <circle cx="200" cy="200" r="192" fill="none" stroke="#d97757" stroke-width="4" opacity="0.5"/>
  <circle cx="200" cy="200" r="176" fill="url(#pbg)"/>

  <g clip-path="url(#round)">
    <!-- shoulders -->
    <path d="M84 400 q4 -110 116 -128 q112 18 116 128 Z" fill="#1a3225"/>
    <!-- collar -->
    <path d="M150 300 q50 46 100 0 l0 30 q-50 40 -100 0 Z" fill="#234534"/>

    <!-- neck -->
    <path d="M176 250 h48 v40 q-24 20 -48 0 Z" fill="#c89a3a" opacity="0.85"/>

    <!-- head (3/4) -->
    <ellipse cx="200" cy="196" rx="66" ry="74" fill="#e0b98a"/>

    <!-- hair (soft silver, swept up) -->
    <path d="M134 196 q-6 -92 66 -98 q72 6 66 98 q2 -34 -18 -52 q-2 24 -14 30 q-8 -18 -34 -20 q-26 2 -34 20 q-12 -6 -14 -30 q-20 18 -18 52 Z" fill="#f5efe4"/>
    <path d="M138 200 q-10 40 6 74 q-30 -34 -6 -74 Z" fill="#f5efe4"/>
    <path d="M262 200 q10 40 -6 74 q30 -34 6 -74 Z" fill="#f5efe4"/>

    <!-- gentle features -->
    <g stroke="#1a3225" stroke-width="3.2" stroke-linecap="round" fill="none" opacity="0.8">
      <path d="M176 188 q8 -6 18 0"/>
      <path d="M206 188 q8 -6 18 0"/>
      <path d="M186 232 q14 10 28 0"/>
    </g>
    <!-- soft cheeks -->
    <circle cx="172" cy="216" r="9" fill="#d97757" opacity="0.28"/>
    <circle cx="228" cy="216" r="9" fill="#d97757" opacity="0.28"/>
    <!-- nose -->
    <path d="M200 200 v14 q-5 4 -8 4" stroke="#b58a5e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- glasses -->
    <g stroke="#1a3225" stroke-width="3" fill="none" opacity="0.85">
      <circle cx="185" cy="196" r="17"/>
      <circle cx="231" cy="196" r="17"/>
      <path d="M202 194 h12"/>
      <path d="M168 192 l-16 -4"/>
      <path d="M248 192 l16 -4"/>
    </g>
  </g>
</svg>
