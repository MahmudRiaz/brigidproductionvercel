<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brigid — Family Dashboard (live demo)</title>
<meta name="description" content="A live, interactive demo of the Brigid family dashboard, built around Eleanor Ward's twelfth day of recovery after a hip replacement." />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Geist:wght@300..700&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #f5efe4; --cream-2: #ece3d2; --cream-3: #e2d6bf; --paper: #fbf7ee;
    --ink: #11140f; --ink-2: #2c3329; --muted: #6c7062; --muted-2: #989a8c;
    --forest: #1a3225; --forest-2: #234534; --sage: #7c9879;
    --sage-light: #c8d6c0; --sage-bg: #e3ead8;
    --coral: #d97757; --coral-bg: #f4d9cc;
    --amber: #c89a3a; --amber-bg: #f0e3c2;
    --rose: #b85c5c; --rose-bg: #f0d4d4;
    --success: #4f7a4d; --success-bg: #d6e3cd;
    --line: rgba(26,50,37,0.10); --line-2: rgba(26,50,37,0.18);
    --shadow-sm: 0 1px 2px rgba(26,50,37,0.04);
    --shadow: 0 6px 24px -8px rgba(26,50,37,0.12);
    --shadow-lg: 0 20px 60px -20px rgba(26,50,37,0.18);
    --serif: 'Newsreader','Instrument Serif',Georgia,serif;
    --display: 'Instrument Serif','Newsreader',Georgia,serif;
    --sans: 'Geist',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{margin:0;padding:0}
  body{font-family:var(--sans);background:var(--cream);color:var(--ink);font-size:15px;line-height:1.5;min-height:100vh}
  button{font:inherit;cursor:pointer;border:0;background:transparent;color:inherit}
  input{font:inherit}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--forest);color:var(--cream)}
  .serif{font-family:var(--serif);font-weight:400;letter-spacing:-0.01em}
  .display{font-family:var(--display);font-weight:400;letter-spacing:-0.02em;line-height:1}
  .italic{font-style:italic}
  #root{min-height:100vh}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;background:var(--forest);color:var(--cream);font-size:14px;font-weight:500;transition:transform .15s ease,background .15s ease}
  .btn:hover{background:var(--forest-2);transform:translateY(-1px)}
  .btn-ghost{background:transparent;color:var(--forest);border:1px solid var(--line-2)}
  .btn-ghost:hover{background:rgba(26,50,37,0.04)}
  .btn-light{background:var(--cream-2);color:var(--forest)}
  .btn-light:hover{background:var(--cream-3)}
  .dash{background:var(--cream);min-height:100vh}
  .dash-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:30}
  .dash-nav-left{display:flex;align-items:center;gap:28px}
  .dash-nav-tabs{display:flex;gap:4px}
  .tab{padding:8px 14px;border-radius:999px;font-size:13px;color:var(--ink-2);transition:background .15s ease}
  .tab:hover{background:rgba(26,50,37,0.05)}
  .tab.active{background:var(--forest);color:var(--cream)}
  .dash-nav-right{display:flex;align-items:center;gap:12px}
  .back-link{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);padding:7px 13px;border-radius:999px;border:1px solid var(--line-2);transition:background .15s ease,color .15s ease}
  .back-link:hover{background:rgba(26,50,37,0.04);color:var(--forest)}
  .demo-pill{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;font-weight:600;color:var(--sage);background:var(--sage-bg);padding:4px 9px;border-radius:999px}
  .user-bubble{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;background:var(--cream-2);border-radius:999px}
  .user-bubble .avatar{width:30px;height:30px;border-radius:50%;background:var(--forest);color:var(--cream);display:grid;place-items:center;font-size:12px;font-weight:500}
  .user-bubble .name{font-size:13px;line-height:1.15}
  .user-bubble .name .rel{font-size:11px;color:var(--muted);display:block}
  .dash-main{max-width:1320px;margin:0 auto;padding:32px 32px 80px}
  .patient-hero{display:grid;grid-template-columns:1.4fr 1fr;gap:32px;margin-bottom:32px;align-items:stretch}
  .patient-card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:28px 32px;display:flex;flex-direction:column;gap:18px}
  .patient-top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
  .patient-id{display:flex;align-items:center;gap:18px}
  .patient-avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--forest),var(--sage));color:var(--cream);display:grid;place-items:center;font-family:var(--display);font-size:24px}
  .patient-name{font-family:var(--display);font-size:36px;line-height:1.05;letter-spacing:-0.02em}
  .patient-meta{font-size:13px;color:var(--muted);margin-top:4px}
  .status-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:500}
  .status-pill.green{background:var(--success-bg);color:var(--success)}
  .status-pill.amber{background:var(--amber-bg);color:var(--amber)}
  .status-pill.red{background:var(--coral-bg);color:var(--coral)}
  .patient-summary{background:var(--cream);border-radius:14px;padding:16px 18px;font-size:14px;line-height:1.55;color:var(--ink-2);border-left:3px solid var(--sage)}
  .patient-summary .label{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .quick-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
  .quick-stat{padding:4px 14px;border-right:1px solid var(--line)}
  .quick-stat:first-child{padding-left:0}
  .quick-stat:last-child{border-right:0;padding-right:0}
  .quick-stat .qs-label{font-size:11px;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase}
  .quick-stat .qs-value{font-family:var(--display);font-size:22px;color:var(--ink);margin-top:2px}
  .next-call-card{background:var(--forest);color:var(--cream);border-radius:20px;padding:28px 32px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
  .next-call-card::after{content:'';position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;background:rgba(245,239,228,0.06)}
  .next-call-card .label{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;opacity:0.7}
  .next-call-card .when{font-family:var(--display);font-size:38px;line-height:1;margin-top:8px;letter-spacing:-0.02em}
  .next-call-card .sub{font-size:14px;opacity:0.78;margin-top:6px}
  .next-call-card .actions{display:flex;gap:8px;margin-top:18px;position:relative;z-index:1}
  .btn-light-on-dark{padding:9px 16px;border-radius:999px;background:rgba(245,239,228,0.12);color:var(--cream);font-size:13px;border:1px solid rgba(245,239,228,0.18);transition:background .15s ease}
  .btn-light-on-dark:hover{background:rgba(245,239,228,0.2)}
  .rings-row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:32px}
  .ring-card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:18px;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
  .ring-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line-2)}
  .ring-card-head{display:flex;align-items:center;justify-content:space-between}
  .ring-card-title{font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
  .ring-card-cta{font-size:12px;color:var(--forest);display:flex;align-items:center;gap:4px;opacity:0.7}
  .ring-card:hover .ring-card-cta{opacity:1}
  .ring-card-body{display:grid;grid-template-columns:1fr 1.1fr;gap:18px;align-items:center}
  .ring-label{font-size:14px;color:var(--ink-2)}
  .ring-delta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-top:2px}
  .ring-delta.up{color:var(--success)}
  .ring-delta.down{color:var(--coral)}
  .card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:32px}
  .card-grid.two{grid-template-columns:1.4fr 1fr}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px}
  .card-clickable{cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
  .card-clickable:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line-2)}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .card-eyebrow{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
  .card-title{font-family:var(--display);font-size:24px;line-height:1.1;letter-spacing:-0.01em;color:var(--ink);margin-top:4px}
  .card-sub{font-size:13px;color:var(--muted);margin-top:4px}
  .bar-row{display:flex;align-items:center;gap:12px;font-size:13px}
  .bar-row .bar-label{width:110px;color:var(--ink-2)}
  .bar-row .bar-track{flex:1;height:8px;background:var(--cream-2);border-radius:999px;overflow:hidden}
  .bar-row .bar-fill{height:100%;border-radius:999px;transition:width .4s ease}
  .bar-row .bar-val{width:48px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .legend .item{display:flex;align-items:center;gap:6px}
  .legend .swatch{width:10px;height:10px;border-radius:3px}
  .trend-cells{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
  .trend-cells .cell{aspect-ratio:1;border-radius:4px;border:1px solid transparent;cursor:pointer;transition:transform .1s ease}
  .trend-cells .cell:hover{transform:scale(1.15)}
  .blood-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;padding:14px 0;border-bottom:1px dashed var(--line)}
  .blood-row:last-child{border-bottom:0}
  .blood-name{font-size:14px;color:var(--ink)}
  .blood-name .layman{font-size:12px;color:var(--muted);margin-top:2px;display:block}
  .blood-val{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .blood-val .v{font-family:var(--display);font-size:22px;line-height:1;color:var(--ink)}
  .blood-val .v .u{font-size:12px;color:var(--muted);margin-left:3px}
  .blood-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:500}
  .blood-tag.normal{background:var(--success-bg);color:var(--success)}
  .blood-tag.high{background:var(--coral-bg);color:var(--coral)}
  .blood-tag.low{background:var(--amber-bg);color:var(--amber)}
  .timeline-list{display:flex;flex-direction:column;gap:0}
  .timeline-item{display:grid;grid-template-columns:90px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line);cursor:pointer;transition:background .12s ease}
  .timeline-item:hover{background:var(--cream);margin:0 -12px;padding:14px 12px;border-radius:8px}
  .timeline-item:first-child{border-top:0}
  .timeline-when{display:flex;flex-direction:column;gap:2px}
  .timeline-when .day{font-family:var(--display);font-size:18px;line-height:1;color:var(--ink)}
  .timeline-when .time{font-size:11px;color:var(--muted)}
  .timeline-body{display:flex;flex-direction:column;gap:4px}
  .timeline-body .title{font-size:14px;color:var(--ink);display:flex;align-items:center;gap:8px}
  .timeline-body .snippet{font-size:13px;color:var(--ink-2);line-height:1.5}
  .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .status-dot.green{background:var(--success)}
  .status-dot.amber{background:var(--amber)}
  .status-dot.red{background:var(--coral)}
  .modal-backdrop{position:fixed;inset:0;z-index:50;background:rgba(17,20,15,0.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;padding:24px;animation:fadeIn .2s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal{background:var(--paper);border-radius:22px;max-width:720px;width:100%;max-height:86vh;overflow-y:auto;border:1px solid var(--line);box-shadow:var(--shadow-lg);animation:slideUp .25s ease}
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;padding:28px 32px 16px;gap:16px}
  .modal-title{font-family:var(--display);font-size:32px;line-height:1.05;letter-spacing:-0.01em}
  .modal-sub{font-size:13px;color:var(--muted);margin-top:6px}
  .modal-close{width:32px;height:32px;border-radius:50%;background:var(--cream-2);display:grid;place-items:center;flex-shrink:0}
  .modal-close:hover{background:var(--cream-3)}
  .modal-body{padding:0 32px 32px}
  .modal-section{padding:20px 0;border-top:1px solid var(--line)}
  .modal-section:first-child{border-top:0}
  .modal-section h4{font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:500}
  .laymanbox{background:var(--cream);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--ink-2);line-height:1.55;border-left:3px solid var(--sage)}
  .laymanbox .lbl{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--sage);font-weight:500;display:block;margin-bottom:4px}
  .sec-label{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 16px}
  .sec-label h2{font-family:var(--display);font-size:26px;letter-spacing:-0.01em;margin:0;font-weight:400}
  .sec-label .meta{font-size:12px;color:var(--muted)}
  @media(max-width:1100px){
    .patient-hero{grid-template-columns:1fr}
    .rings-row,.card-grid,.card-grid.two{grid-template-columns:1fr}
    .quick-stats{grid-template-columns:repeat(2,1fr);gap:12px}
    .quick-stat{border-right:0;padding-left:0}
    .dash-nav{padding:16px 20px}
    .dash-main{padding:24px 20px 80px}
  }
</style>
</head>

<script type="text/babel">
// Shared visual primitives: rings, sparklines, etc.
const { useState, useEffect, useRef } = React;

function Ring({ value, max = 100, size = 140, stroke = 12, color = '#1a3225', track = '#ece3d2', children, animate = true, gradient }) {
  const [v, setV] = useState(animate ? 0 : value);
  useEffect(() => {
    if (!animate) { setV(value); return; }
    const t = setTimeout(() => setV(value), 80);
    return () => clearTimeout(t);
  }, [value, animate]);
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(1, v / max));
  const gradId = 'g-' + Math.random().toString(36).slice(2, 9);
  return (
    <div style={{ position: 'relative', width: size, height: size, flexShrink: 0 }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
        {gradient && (
          <defs>
            <linearGradient id={gradId} x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor={gradient[0]} />
              <stop offset="100%" stopColor={gradient[1]} />
            </linearGradient>
          </defs>
        )}
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={track} strokeWidth={stroke} />
        <circle cx={size/2} cy={size/2} r={r} fill="none"
          stroke={gradient ? `url(#${gradId})` : color}
          strokeWidth={stroke} strokeLinecap="round"
          strokeDasharray={c} strokeDashoffset={c * (1 - pct)}
          style={{ transition: 'stroke-dashoffset 1.2s cubic-bezier(.2,.7,.2,1)' }} />
      </svg>
      <div style={{ position: 'absolute', inset: 0, display: 'grid', placeItems: 'center', textAlign: 'center' }}>{children}</div>
    </div>
  );
}

function MultiRing({ values, size = 150, gap = 4, stroke = 8, colors = ['#1a3225','#7c9879','#c89a3a'], track = '#ece3d2', children }) {
  const rings = values.map((v, i) => ({ v, inset: i * (stroke + gap) }));
  return (
    <div style={{ position: 'relative', width: size, height: size, flexShrink: 0 }}>
      {rings.map((ring, i) => {
        const sz = size - ring.inset * 2;
        const r = (sz - stroke) / 2;
        const c = 2 * Math.PI * r;
        const pct = Math.max(0, Math.min(1, ring.v / 100));
        return (
          <svg key={i} width={sz} height={sz} style={{ position: 'absolute', top: ring.inset, left: ring.inset, transform: 'rotate(-90deg)' }}>
            <circle cx={sz/2} cy={sz/2} r={r} fill="none" stroke={track} strokeWidth={stroke} />
            <circle cx={sz/2} cy={sz/2} r={r} fill="none" stroke={colors[i]} strokeWidth={stroke} strokeLinecap="round"
              strokeDasharray={c} strokeDashoffset={c * (1 - pct)}
              style={{ transition: 'stroke-dashoffset 1.2s cubic-bezier(.2,.7,.2,1)' }} />
          </svg>
        );
      })}
      <div style={{ position: 'absolute', inset: 0, display: 'grid', placeItems: 'center', textAlign: 'center' }}>{children}</div>
    </div>
  );
}

function Sparkline({ data, w = 220, h = 56, color = '#1a3225', fill = '#e3ead8', invert = false, lastDotColor }) {
  if (!data || data.length === 0) return null;
  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = max - min || 1;
  const stepX = w / (data.length - 1);
  const pts = data.map((d, i) => {
    const x = i * stepX;
    const y = h - ((d - min) / range) * (h - 10) - 5;
    return [x, invert ? h - y : y];
  });
  const path = pts.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(' ');
  const area = `${path} L${w},${h} L0,${h} Z`;
  const last = pts[pts.length - 1];
  return (
    <svg width={w} height={h} style={{ display: 'block', overflow: 'visible' }}>
      <path d={area} fill={fill} opacity="0.55" />
      <path d={path} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      <circle cx={last[0]} cy={last[1]} r="4" fill={lastDotColor || color} stroke="#fbf7ee" strokeWidth="2" />
    </svg>
  );
}

function StatusGrid({ data, onCellClick }) {
  const colorFor = (s) => ({ green: 'var(--success-bg)', amber: 'var(--amber-bg)', red: 'var(--coral-bg)' }[s] || 'var(--cream-2)');
  const borderFor = (s) => ({ green: 'var(--success)', amber: 'var(--amber)', red: 'var(--coral)' }[s] || 'var(--line)');
  return (
    <div className="trend-cells">
      {data.map((s, i) => (
        <div key={i} className="cell" style={{ background: colorFor(s), borderColor: borderFor(s) + '40' }}
          title={`Day ${i + 1}: ${s}`} onClick={() => onCellClick && onCellClick(i, s)} />
      ))}
    </div>
  );
}

  calendar: (p={}) => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" {...p}><rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" strokeWidth="1.6"/><path d="M16 2v4M8 2v4M3 10h18" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>,
  pill: (p={}) => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" {...p}><rect x="3.5" y="8" width="17" height="8" rx="4" transform="rotate(-45 12 12)" stroke="currentColor" strokeWidth="1.6"/><path d="M14.5 9.5l-5 5" stroke="currentColor" strokeWidth="1.6"/></svg>,
  heart: (p={}) => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" {...p}><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/></svg>,
  walking: (p={}) => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" {...p}><circle cx="13" cy="4" r="2" stroke="currentColor" strokeWidth="1.6"/><path d="m4 22 5-9 4 2 3-5 4 4M10 13 6 7" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  droplet: (p={}) => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" {...p}><path d="M12 2.7s5.5 5.7 5.5 10.3a5.5 5.5 0 0 1-11 0c0-4.6 5.5-10.3 5.5-10.3Z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/></svg>,
  spark: (p={}) => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" {...p}><path d="M3 12h4l3-9 4 18 3-9h4" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  close: (p={}) => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" {...p}><path d="M18 6 6 18M6 6l12 12" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>,
  sparkle: (p={}) => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" {...p}><path d="M12 3v3M12 18v3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M3 12h3M18 12h3M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>,
  chevron: (p={}) => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" {...p}><path d="m9 6 6 6-6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>,

};

Object.assign(window, { Ring, MultiRing, Sparkline, StatusGrid, Icons });

    return () => window.removeEventListener('keydown', h);

  return (
    <div className="modal-backdrop" onClick={onClose}>

function BloodRange({ value, range, status }) {

  return (
    <div style={{ position: 'relative', height: 8, background: 'var(--cream-2)', borderRadius: 999, marginTop: 14 }}>
      <div style={{ position: 'absolute', left: pct(lo)+'%', right: (100-pct(hi))+'%', top: 0, bottom: 0, background: 'var(--sage-light)', borderRadius: 999 }} />

function ChartLine({ data, color, fill, yMin, yMax, invert }) {
  const w = 640, h = 160;
  const padX = 24, padY = 16;
  const innerW = w - padX*2, innerH = h - padY*2;
  const min = yMin != null ? yMin : Math.min(...data);
  const max = yMax != null ? yMax : Math.max(...data);
  const range = max - min || 1;
  const stepX = innerW / (data.length - 1);
  const pts = data.map((d, i) => {
    const x = padX + i * stepX;
    const yNorm = (d - min) / range;
    const y = padY + innerH - (invert ? 1 - yNorm : yNorm) * innerH;
    return [x, y];
  });
  const path = pts.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(' ');
  const area = `${path} L${padX + innerW},${padY + innerH} L${padX},${padY + innerH} Z`;
  return (
    <div style={{ position: 'relative' }}>
      <svg viewBox={`0 0 ${w} ${h}`} style={{ width: '100%', height: 160, display: 'block' }} preserveAspectRatio="none">
        {[0, 0.25, 0.5, 0.75, 1].map((t, i) => (<line key={i} x1={padX} x2={padX + innerW} y1={padY + innerH * t} y2={padY + innerH * t} stroke="var(--line)" strokeDasharray="2 4" />))}
        <path d={area} fill={fill} opacity="0.6" />
        <path d={path} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
        {pts.map((p, i) => (<circle key={i} cx={p[0]} cy={p[1]} r={i === pts.length - 1 ? 5 : 3} fill={color} stroke="var(--paper)" strokeWidth="2" />))}
      </svg>
      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, color: 'var(--muted)', marginTop: 4, padding: '0 4px' }}>
        <span>14 days ago</span><span>7 days ago</span><span>Today</span>
      </div>
    </div>
  );
}

const STORAGE_KEY = 'brigid_records_v1';
function loadRecords() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return JSON.parse(JSON.stringify(RECORDS_DEFAULTS));
}
function saveRecords(r) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(r)); } catch (e) {} }

function RecordsPage() {
  const [records, setRecords] = useStateP(loadRecords);
  const [saved, setSaved] = useStateP(false);
  useEffectP(() => { saveRecords(records); }, [records]);
  const flash = () => { setSaved(true); setTimeout(() => setSaved(false), 1800); };
  const updateAbout = (field, value) => { setRecords(r => ({ ...r, about: { ...r.about, [field]: value } })); flash(); };
  const updateHome = (field, value) => { setRecords(r => ({ ...r, home: { ...r.home, [field]: value } })); flash(); };
  const updatePref = (field, value) => { setRecords(r => ({ ...r, preferences: { ...r.preferences, [field]: value } })); flash(); };
  const addListItem = (key, item) => { setRecords(r => ({ ...r, [key]: [...r[key], item] })); flash(); };
  const updateListItem = (key, i, item) => { setRecords(r => ({ ...r, [key]: r[key].map((x, idx) => idx === i ? item : x) })); flash(); };
  const removeListItem = (key, i) => { setRecords(r => ({ ...r, [key]: r[key].filter((_, idx) => idx !== i) })); flash(); };
  const resetAll = () => {
    if (confirm('Reset all records to the original example? Your edits will be lost.')) {
      const fresh = JSON.parse(JSON.stringify(RECORDS_DEFAULTS));
      setRecords(fresh); saveRecords(fresh);

        <button onClick={resetAll} style={{ padding: '8px 14px', borderRadius: 999, fontSize: 13, color: 'var(--muted)', border: '1px solid var(--line-2)' }}>Reset to example</button>
      </div>
      <RecordSection icon={<Icons.heart />} title="About Eleanor" sub="The basics. These appear on the dashboard header.">
        <EditField label="Preferred name" value={records.about.preferredName} onChange={(v) => updateAbout('preferredName', v)} />
        <EditField label="Full legal name" value={records.about.fullName} onChange={(v) => updateAbout('fullName', v)} />
        <EditField label="Date of birth" value={records.about.dob} onChange={(v) => updateAbout('dob', v)} />

      </RecordSection>
      <RecordSection icon={<Icons.spark />} title="Medical conditions" sub="Brigid uses this context when interpreting daily check-ins.">
        <ListEditor items={records.conditions} fields={[{ key: 'name', placeholder: 'Condition', size: 'sm' }, { key: 'detail', placeholder: 'Detail (when diagnosed, current treatment, etc.)', size: 'lg' }]}
          onUpdate={(i, v) => updateListItem('conditions', i, v)} onRemove={(i) => removeListItem('conditions', i)} onAdd={() => addListItem('conditions', { name: '', detail: '' })} addLabel="Add a condition" />
      </RecordSection>
      <RecordSection icon={<Icons.droplet />} title="Allergies" sub="Critical safety information.">
        <ListEditor items={records.allergies} fields={[{ key: 'name', placeholder: 'Allergen', size: 'sm' }, { key: 'detail', placeholder: 'Reaction', size: 'lg' }]}

      </RecordSection>
      <RecordSection icon={<Icons.phone />} title="Emergency contacts" sub="Who Brigid reaches if something looks concerning.">
        <ListEditor items={records.contacts} fields={[{ key: 'name', placeholder: 'Name', size: 'sm' }, { key: 'relation', placeholder: 'Relationship', size: 'md' }, { key: 'phone', placeholder: 'Phone', size: 'sm' }]}

      </RecordSection>
      <RecordSection icon={<Icons.walking />} title="Home setup" sub="Helps Brigid know what's realistic to ask about (stairs, who's around, mobility aids).">
        <EditField label="Living situation" value={records.home.livingWith} onChange={(v) => updateHome('livingWith', v)} />

        <EditField label="Diet" value={records.preferences.diet} onChange={(v) => updatePref('diet', v)} />

      </RecordSection>
      <RecordSection icon={<Icons.calendar />} title="Family notes" sub="A shared journal for things you've noticed, things to discuss with the doctor, or questions for Brigid.">

      </RecordSection>
    </div>
  );
}

  );
}

function RecordSection({ icon, title, sub, children }) {
  return (
    <section style={{ background: 'var(--paper)', border: '1px solid var(--line)', borderRadius: 20, padding: 28, marginBottom: 16 }}>
      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 14, marginBottom: 20 }}>
        <div style={{ width: 36, height: 36, borderRadius: 10, background: 'var(--cream)', color: 'var(--forest)', display: 'grid', placeItems: 'center', flexShrink: 0 }}>{icon}</div>
        <div>
          <h3 style={{ fontFamily: 'var(--display)', fontSize: 22, margin: 0, letterSpacing: '-0.01em', fontWeight: 400 }}>{title}</h3>
          {sub && <p style={{ fontSize: 13, color: 'var(--muted)', margin: '4px 0 0', maxWidth: 560 }}>{sub}</p>}
        </div>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>{children}</div>
    </section>
  );
}

function EditField({ label, value, onChange, hint, multiline }) {
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '180px 1fr', gap: 16, alignItems: hint || multiline ? 'flex-start' : 'center', padding: '6px 0' }}>
      <label style={{ fontSize: 13, color: 'var(--muted)', paddingTop: multiline ? 8 : 0 }}>{label}</label>
      <div>
        {multiline ? (
          <textarea value={value} onChange={(e) => onChange(e.target.value)} rows={3}
            style={{ width: '100%', padding: '10px 14px', borderRadius: 10, background: 'var(--cream)', border: '1px solid transparent', fontSize: 14, color: 'var(--ink)', outline: 'none', fontFamily: 'var(--sans)', lineHeight: 1.5, resize: 'vertical' }} />
        ) : (
          <input type="text" value={value} onChange={(e) => onChange(e.target.value)}
            style={{ width: '100%', padding: '10px 14px', borderRadius: 10, background: 'var(--cream)', border: '1px solid transparent', fontSize: 14, color: 'var(--ink)', outline: 'none' }} />
        )}
        {hint && <div style={{ fontSize: 12, color: 'var(--muted-2)', marginTop: 4 }}>{hint}</div>}
      </div>
    </div>
  );
}

function ListEditor({ items, fields, onUpdate, onRemove, onAdd, addLabel }) {
  const sizes = { sm: '180px', md: '200px', lg: '1fr' };
  const cols = fields.map(f => sizes[f.size] || '1fr').join(' ') + ' auto';
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
      {items.map((item, i) => (
        <div key={i} style={{ display: 'grid', gridTemplateColumns: cols, gap: 10, alignItems: 'center' }}>
          {fields.map(f => (
            <input key={f.key} type="text" placeholder={f.placeholder} value={item[f.key] || ''} onChange={(e) => onUpdate(i, { ...item, [f.key]: e.target.value })}
              style={{ padding: '10px 14px', borderRadius: 10, background: 'var(--cream)', border: '1px solid transparent', fontSize: 14, color: 'var(--ink)', outline: 'none', minWidth: 0 }} />
          ))}
          <button onClick={() => onRemove(i)} title="Remove" style={{ width: 32, height: 32, borderRadius: 8, color: 'var(--muted)', display: 'grid', placeItems: 'center' }}
            onMouseEnter={(e) => e.currentTarget.style.background = 'var(--coral-bg)'} onMouseLeave={(e) => e.currentTarget.style.background = 'transparent'}><Icons.close /></button>
        </div>
      ))}
      <button onClick={onAdd} style={{ alignSelf: 'flex-start', padding: '8px 14px', borderRadius: 999, fontSize: 13, color: 'var(--forest)', border: '1px dashed var(--line-2)', background: 'transparent', marginTop: 4 }}>+ {addLabel}</button>
    </div>
  );
}

function NotesEditor({ notes, onAdd, onRemove }) {
  const [draft, setDraft] = useStateP('');
  const submit = () => { if (!draft.trim()) return; onAdd(draft.trim()); setDraft(''); };
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <div style={{ background: 'var(--cream)', borderRadius: 12, padding: 14 }}>
        <textarea value={draft} onChange={(e) => setDraft(e.target.value)} rows={3} placeholder="Add a note — something you noticed, a question to ask the doctor, an update for the family…"
          style={{ width: '100%', padding: 8, border: 0, outline: 'none', background: 'transparent', fontFamily: 'var(--sans)', fontSize: 14, color: 'var(--ink)', resize: 'vertical', lineHeight: 1.55 }} />
        <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 8 }}>
          <button onClick={submit} disabled={!draft.trim()} style={{ padding: '8px 16px', borderRadius: 999, fontSize: 13, background: draft.trim() ? 'var(--forest)' : 'var(--cream-2)', color: draft.trim() ? 'var(--cream)' : 'var(--muted)', cursor: draft.trim() ? 'pointer' : 'default', transition: 'background .15s ease' }}>Post note</button>
        </div>
      </div>
      {notes.map((n, i) => (
        <div key={i} style={{ padding: 16, borderRadius: 12, background: 'var(--cream)', border: '1px solid var(--line)', display: 'grid', gridTemplateColumns: '1fr auto', gap: 16, alignItems: 'flex-start' }}>
          <div><div style={{ fontSize: 12, color: 'var(--muted)', marginBottom: 6 }}>{n.author} · {n.date}</div><div style={{ fontSize: 14, color: 'var(--ink)', lineHeight: 1.55 }}>{n.text}</div></div>
          <button onClick={() => onRemove(i)} title="Remove" style={{ color: 'var(--muted)', padding: 4 }}><Icons.close /></button>
        </div>
      ))}
      {notes.length === 0 && (<div style={{ fontSize: 13, color: 'var(--muted)', textAlign: 'center', padding: '12px 0' }}>No notes yet. Add the first one above.</div>)}
    </div>
  );
}

function DocList({ docs, onAdd, onRemove }) {
  const fileInputRef = React.useRef(null);
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
      {docs.map((d, i) => (
        <div key={i} style={{ display: 'grid', gridTemplateColumns: '40px 1fr auto auto', gap: 14, alignItems: 'center', padding: '12px 14px', background: 'var(--cream)', borderRadius: 10 }}>
          <div style={{ width: 32, height: 40, borderRadius: 4, background: 'var(--paper)', border: '1px solid var(--line)', display: 'grid', placeItems: 'center', fontSize: 9, color: 'var(--muted)', letterSpacing: '0.04em', fontWeight: 500 }}>PDF</div>
          <div><div style={{ fontSize: 14, color: 'var(--ink)' }}>{d.name}</div><div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 2 }}>{d.size} · Uploaded {d.uploaded} by {d.by}</div></div>
          <button style={{ padding: '6px 12px', borderRadius: 999, fontSize: 12, color: 'var(--forest)', border: '1px solid var(--line-2)' }}>View</button>
          <button onClick={() => onRemove(i)} title="Remove" style={{ color: 'var(--muted)', padding: 4 }}><Icons.close /></button>
        </div>
      ))}
      <input ref={fileInputRef} type="file" style={{ display: 'none' }}
        onChange={(e) => { const f = e.target.files && e.target.files[0]; if (f) onAdd(f.name); e.target.value = ''; }} />
      <button onClick={() => fileInputRef.current && fileInputRef.current.click()}
        style={{ alignSelf: 'flex-start', padding: '10px 16px', borderRadius: 999, fontSize: 13, color: 'var(--forest)', border: '1px dashed var(--line-2)', background: 'transparent', marginTop: 4 }}>+ Upload document</button>
    </div>
  );
}

Object.assign(window, { CallsPage, MedicationsPage, RecordsPage });
</script>
<script type="text/babel">
// App shell — mounts the dashboard directly.
function App() { return <Dashboard onSignOut={() => { window.location.href = 'index.html'; }} />; }
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
